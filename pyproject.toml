[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "i-hierarchical-critic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.11.7", "httpx==0.28.1", "socksio==1.0.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
i-director = "hcl.cli:main"

[tool.setuptools.packages.find]
include = ["hcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
